<!DOCTYPE html>
<html lang="en" data-w31-scheme="default" class="w31-desktop w31-pattern-weave">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Homepage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../dist/bootstra-win31.css">
</head>
<body>
  <div class="w31-page">
    <div class="w31-window">
      <div class="w31-titlebar">
        <button class="w31-sysmenu" type="button" aria-label="Control menu"></button>
        <h1 class="w31-title">My Homepage</h1>
        <button class="w31-ctl w31-ctl-min" type="button" aria-label="Minimize"></button>
        <button class="w31-ctl w31-ctl-max" type="button" aria-label="Maximize"></button>
      </div>
      <nav class="w31-menubar" aria-label="Site">
        <a href="#"><u>H</u>ome</a>
        <a href="#"><u>P</u>rojects</a>
        <a href="#"><u>A</u>bout</a>
      </nav>
      <div class="w31-window-body">
        <div class="row g-3">
          <main class="col-md-8">
            <h2>Welcome</h2>
            <p>Everything here is plain Bootstrap 5 markup. The theme only changes how it looks.</p>
            <button class="btn btn-primary w31-btn-dialog" type="button" data-bs-toggle="modal" data-bs-target="#hello">OK</button>
            <button class="btn w31-btn-dialog" type="button">Cancel</button>
          </main>
          <aside class="col-md-4">
            <div class="card">
              <div class="card-header">Status</div>
              <div class="card-body">
                <div class="w31-gauge" style="--value:75" data-label="75%" role="progressbar" aria-label="Loading" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </aside>
        </div>
      </div>
      <div class="w31-statusbar"><span class="w31-status">Ready</span></div>
    </div>
  </div>

  <div class="modal" id="hello" tabindex="-1" aria-labelledby="helloTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="helloTitle">Hello</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex gap-3 align-items-center">
          <span class="w31-msgicon w31-msgicon-info" aria-hidden="true"></span>
          <span>Thanks for stopping by!</span>
        </div>
        <div class="modal-footer"><button class="btn btn-primary" data-bs-dismiss="modal" type="button">OK</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
