name: Release

# Publishes exactly one workspace package per tag. A tag is `<npm name>@<X.Y.Z>`,
# for example `bootstra-html32@0.1.1`; see docs/RELEASING.md. The private root and
# every other package are never published by this workflow.

on:
  push:
    tags:
      - '*@*'      # unscoped: theme@1.2.3
      - '@*/*@*'   # scoped:   @scope/theme@1.2.3

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm trusted publishing (OIDC) + provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1+
      - run: npm install -g npm@latest

      - name: Validate tag and package
        id: target
        run: node scripts/release.mjs check "$TAG"

      - name: Extract release notes
        run: node scripts/release.mjs notes "$TAG" > release-notes.md

      - run: npm ci

      - name: Test the package
        env:
          NAME: ${{ steps.target.outputs.name }}
        run: npm test --workspace "$NAME"

      - name: Check package contents
        run: |
          node scripts/release.mjs assets "$TAG" > release-assets.txt
          cat release-assets.txt

      - name: Publish to npm
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$NAME@$VERSION is already on npm, skipping publish"
          else
            npm publish --workspace "$NAME"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          mapfile -t ASSETS < release-assets.txt
          gh release create "$TAG" "${ASSETS[@]}" \
            --verify-tag \
            --title "$NAME $VERSION" \
            --notes-file release-notes.md
