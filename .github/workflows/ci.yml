name: CI

# Validates every workspace on every change. There are deliberately no path filters:
# the root lockfile and release script are shared, and a full run takes under a minute.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Lint, build and test every package (themes first, then the showcase), then
      # run the release checks, which also pack every publishable package.
      - run: npm test
